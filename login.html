<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Leitores PRO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<style>
*{font-family:'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#0d6efd 0%,#084298 100%);display:flex;align-items:center;justify-content:center;padding:20px;margin:0}
.login-card{width:100%;max-width:440px;background:white;border-radius:20px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{width:64px;height:64px;background:linear-gradient(135deg,#0d6efd,#1e88e5);border-radius:16px;display:flex;align-items:center;justify-content:center;color:white;font-size:30px;margin:0 auto 16px}
.btn-login{background:#0d6efd;border:none;padding:12px;font-weight:700;font-size:16px}
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="logo"><i class="bi bi-cpu"></i></div>
    <h4 class="fw-bold text-primary mb-1"><i class="bi bi-upc-scan"></i> Sistema Teste Leitores</h4>
    <p class="text-muted small mb-0">Leitores PRO - EL250 / BR520 / FLASH</p>
  </div>
  <div id="alertBox" class="alert alert-danger py-2 small d-none"></div>
  <div class="mb-3"><label class="form-label fw-semibold small">Usuário</label><input id="user" class="form-control" value="admin" autofocus></div>
  <div class="mb-3"><label class="form-label fw-semibold small">Senha</label><div class="input-group"><input id="pass" type="password" class="form-control" value="123"><button class="btn btn-outline-secondary" type="button" onclick="let p=document.getElementById('pass');p.type=p.type==='password'?'text':'password'"><i class="bi bi-eye"></i></button></div></div>
  <button class="btn btn-primary w-100 btn-login" id="btnEntrar">Entrar</button>
  <div class="mt-4 d-flex gap-2 small">
    <div class="flex-fill p-2 rounded" style="background:#f8d7da"><strong class="text-danger"><i class="bi bi-shield-lock"></i> ADMIN</strong><br><span style="font-size:11px">Acesso total</span></div>
    <div class="flex-fill p-2 rounded" style="background:#d1e7dd"><strong class="text-success"><i class="bi bi-person-gear"></i> OPERADOR</strong><br><span style="font-size:11px">Testes + Etiquetas</span></div>
  </div>
</div>
<script>
(function(){
  function getOps(){try{return JSON.parse(localStorage.getItem('operadores')||'[]')}catch{return []}}
  function saveSess(r,n,m,i){sessionStorage.setItem('logged','true');sessionStorage.setItem('user_role',r);sessionStorage.setItem('user_nome',n);sessionStorage.setItem('user_matricula',m);sessionStorage.setItem('user_id',i||m);}
  window.tentarLoginLocal=function(u,p){
    u=(u||'').trim(); p=(p||'').trim();
    if(!u||!p) return {ok:false,msg:'Preencha usuário e senha'};
    if(u.toLowerCase()==='admin' && p==='123'){saveSess('admin','Administrador','ADMIN','admin');return {ok:true,redirect:'index.html'};}
    const ops=getOps(); let op=ops.find(o=>o.matricula.toLowerCase()===u.toLowerCase()&&o.status==='Ativo'); if(!op) op=ops.find(o=>o.usuario&&o.usuario.toLowerCase()===u.toLowerCase()&&o.status==='Ativo');
    if(op){const sc=op.senha||op.matricula; if(p===sc){const role=op.perfil==='admin'?'admin':'operador'; saveSess(role,op.nome,op.matricula,op.id); return {ok:true,redirect:'testes.html'};}else return {ok:false,msg:'Senha inválida'};}
    return {ok:false,msg:'Usuário ou senha inválidos'};
  }
})();
if(!localStorage.getItem('operadores')) localStorage.setItem('operadores',JSON.stringify([{id:'1',matricula:'ADMIN',nome:'Administrador',usuario:'admin',senha:'123',perfil:'admin',status:'Ativo'}]));
function doLogin(){const u=document.getElementById('user').value,p=document.getElementById('pass').value;const r=window.tentarLoginLocal(u,p);if(r.ok) location.href=r.redirect; else {const b=document.getElementById('alertBox');b.textContent=r.msg;b.classList.remove('d-none');}}
document.getElementById('btnEntrar').addEventListener('click',doLogin);
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('user').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
